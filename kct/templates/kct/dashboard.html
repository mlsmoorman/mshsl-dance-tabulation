<h2>KCT Dashboard — {{ meet.name }}</h2>

<table class="table table-bordered">
  <thead>
    <tr>
      <th>Team</th>
      <th>Division</th>
      <th>Order</th>
      <th>KCT Entry</th>
    </tr>
  </thead>

  <tbody>
    {% for entry in entries %}
      <tr>
        <td>{{ entry.team.name }}</td>
        <td>{{ entry.division }}</td>
        <td>{{ entry.performance_order }}</td>
        <td>
          <a href="{% url 'kct_entry' entry.id %}" class="btn btn-primary btn-sm">
            Open KCT
          </a>
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
