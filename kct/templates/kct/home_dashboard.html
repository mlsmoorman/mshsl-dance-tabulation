{% extends "base.html" %}

{% block content %}
<h1>KCT Dashboard</h1>
<h2>Select Your Meet</h2>

<div class="card-list">
    {% for meet in meets %}
    <a class="role-card" href="{% url 'kct:division_selector' meet.id %}">
        <h3>{{ meet.name }}</h3>
        <p>{{ meet.date }}</p>
    </a>
    {% endfor %}
</div>

<style>
.card-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}
.role-card {
    padding: 20px;
    border-radius: 8px;
    background: #f8f9fa;
    border: 1px solid #ddd;
    text-decoration: none;
    color: #000;
    transition: box-shadow .2s ease;
}
.role-card:hover {
    box-shadow: 0 0 10px rgba(0,0,0,.15);
}
</style>
{% endblock %}
