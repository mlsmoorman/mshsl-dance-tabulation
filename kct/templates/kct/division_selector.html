{% extends "base.html" %}

{% block content %}

<h1>KCT — {{ meet.name }}</h1>
<h2>Select Division</h2>

<div class="division-grid">

    {% for division in divisions %}
    <a class="division-card"
       href="{% url 'kct:kct_dashboard' meet.id division %}">

        <h3>{{ division }}</h3>

    </a>
    {% endfor %}

</div>

<style>
/* ===== Grid Layout ===== */
.division-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-top: 20px;
}

/* ===== Cards ===== */
.division-card {
    display: block;
    padding: 25px;
    border-radius: 10px;
    background: #fafafa;
    border: 1px solid #ddd;
    text-decoration: none;
    color: #000;
    transition: box-shadow .2s ease, transform .2s ease;
}
.division-card:hover {
    box-shadow: 0 0 12px rgba(0,0,0,.15);
    transform: translateY(-3px);
}

/* ===== Division Chip ===== */
.division-chip {
    display: inline-block;
    margin-top: 10px;
    background: #e3f2fd;
    color: #0d47a1;
    padding: 4px 10px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 13px;
}

/* ===== Button ===== */
.open-button {
    display: inline-block;
    margin-top: 15px;
    padding: 8px 14px;
    background: #007bff;
    color: white;
    border-radius: 6px;
    font-weight: bold;
    font-size: 14px;
}
</style>

{% endblock %}
